<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="referrer" content="no-referrer" />
    <meta name="format-detection" content="telephone=no" />
    <title>{{APP_NAME}} Draw</title>
    <!--STYLE-->
  </head>
  <body>
    <header class="bar">
      <div class="brand">
        <svg class="mark" viewBox="0 0 100 100" fill="none" aria-hidden="true">
          <path d="M53 21H41A15.5 15.5 0 0 0 41 52A15.5 15.5 0 0 1 41 83H27" stroke="currentColor" stroke-width="7.5" stroke-linecap="round" />
          <circle cx="27" cy="83" r="9" fill="currentColor" />
          <path d="M68 4C69.19 15.56 73.44 19.81 85 21C73.44 22.19 69.19 26.44 68 38C66.81 26.44 62.56 22.19 51 21C62.56 19.81 66.81 15.56 68 4Z" fill="currentColor" />
        </svg>
        <span class="title">{{APP_NAME}} Draw</span>
        <span class="tag">Companion</span>
      </div>
      <div class="spacer"></div>
      <button id="status" class="pill" data-state="connecting" type="button" aria-live="polite">
        <span class="dot"></span><span id="status-text">Connecting…</span>
      </button>
      <button id="send" class="primary" type="button" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6" /></svg>
        <span id="send-text">Send to {{APP_NAME}}</span>
      </button>
    </header>

    <main id="stage">
      <canvas id="base"></canvas>
      <canvas id="live"></canvas>
      <div id="hint" class="hint">Draw with Apple Pencil · hold at the end of a stroke to straighten it</div>
    </main>

    <nav id="toolbar" class="toolbar" aria-label="Drawing tools">
      <div class="group" role="radiogroup" aria-label="Tool">
        <button class="tool" data-tool="pen" type="button" aria-label="Pen" title="Pen">
          <svg viewBox="0 0 24 24"><path d="M4 20l1.2-4.4L15.6 5.2a2 2 0 0 1 2.8 0l.4.4a2 2 0 0 1 0 2.8L8.4 18.8 4 20z" /><path d="M13.8 7l3.2 3.2" /></svg>
        </button>
        <button class="tool" data-tool="highlighter" type="button" aria-label="Highlighter" title="Highlighter">
          <svg viewBox="0 0 24 24"><path d="M9 15l-3.5 3.5H3l3.2-3.2" /><path d="M9 15l-2-2 8.6-8.6a2 2 0 0 1 2.8 0l1.2 1.2a2 2 0 0 1 0 2.8L11 17l-2-2z" /><path d="M13 21h8" /></svg>
        </button>
        <button class="tool" data-tool="eraser" type="button" aria-label="Eraser" title="Eraser (removes whole strokes)">
          <svg viewBox="0 0 24 24"><path d="M8.5 20H20" /><path d="M4.4 15.6l9.2-9.2a2 2 0 0 1 2.8 0l3.2 3.2a2 2 0 0 1 0 2.8L12 20H8.8l-4.4-4.4z" /><path d="M9 11l6 6" /></svg>
        </button>
      </div>
      <div class="sep"></div>
      <div id="swatches" class="group" role="radiogroup" aria-label="Color"></div>
      <div class="sep"></div>
      <div id="widths" class="group" role="radiogroup" aria-label="Width"></div>
      <div class="sep"></div>
      <div class="group">
        <button id="undo" class="tool" type="button" aria-label="Undo" title="Undo">
          <svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5" /><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11" /></svg>
        </button>
        <button id="redo" class="tool" type="button" aria-label="Redo" title="Redo">
          <svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5" /><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13" /></svg>
        </button>
        <button id="clear" class="tool" type="button" aria-label="Clear drawing" title="Clear drawing">
          <svg viewBox="0 0 24 24"><path d="M4 7h16" /><path d="M10 11v6M14 11v6" /><path d="M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12" /><path d="M9 7V4h6v3" /></svg>
        </button>
      </div>
      <div class="sep"></div>
      <div class="group">
        <button id="finger" class="chip" type="button" title="Drawing with your finger">
          <svg viewBox="0 0 24 24"><path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V11" /><path d="M12 10.5V9a1.5 1.5 0 0 1 3 0v2" /><path d="M15 10.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-.6a6 6 0 0 1-4.8-2.4L4.3 15.5a1.5 1.5 0 0 1 2.3-1.9L9 16" /></svg>
          <span id="finger-text">Auto</span>
        </button>
        <button id="zoom" class="chip" type="button" title="Reset zoom" hidden>100%</button>
      </div>
    </nav>

    <div id="confirm" class="popover" role="dialog" aria-label="Clear drawing" hidden>
      <p>Clear the whole drawing?</p>
      <div class="row">
        <button id="confirm-cancel" class="ghost" type="button">Cancel</button>
        <button id="confirm-ok" class="danger" type="button">Clear</button>
      </div>
    </div>

    <div id="session" class="popover session" role="dialog" aria-label="Session" hidden>
      <p class="strong" id="session-title">Connected</p>
      <p class="muted">End-to-end encrypted · stays on your local network · closes automatically</p>
      <div class="row">
        <button id="session-close" class="ghost" type="button">Close</button>
        <button id="session-end" class="danger" type="button">End session</button>
      </div>
    </div>

    <div id="toast" class="toast" role="status" hidden></div>

    <div id="overlay" class="overlay" hidden>
      <div class="sheet">
        <div id="overlay-icon" class="badge"></div>
        <h1 id="overlay-title"></h1>
        <p id="overlay-text"></p>
        <button id="overlay-action" class="ghost" type="button" hidden></button>
      </div>
    </div>
    <!--SCRIPT-->
  </body>
</html>
