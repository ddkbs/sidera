# Weekly dependency updates as pull requests; CI (typecheck + tests + build) runs on each one.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # minor/patch bumps in one PR per week; majors come separately
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Electron majors need a manual check (native better-sqlite3 rebuild)
      - dependency-name: electron
        update-types: [version-update:semver-major]
      # majors we upgrade deliberately, not via bot PRs:
      # TypeScript 7 (native rewrite), Vite / plugin-react (wait for electron-vite support),
      # @types/node (follows the Node version inside Electron)
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: vite
        update-types: [version-update:semver-major]
      - dependency-name: '@vitejs/plugin-react'
        update-types: [version-update:semver-major]
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
