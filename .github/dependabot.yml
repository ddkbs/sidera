# Weekly dependency updates as pull requests; CI (typecheck + tests + build) runs on each one.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # minor/patch bumps in one PR per week; majors come separately
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Electron majors need a manual check (native better-sqlite3 rebuild)
      - dependency-name: electron
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
